# Builds and pushes the runner image:
#   gcloud builds submit deploy/runner --config deploy/runner/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/adk-monitor/runner
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:latest", "."]
images: ["${_IMAGE}:latest"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
