# Known cross-SDK divergences.
#
# A conformance test whose failures are all covered by a live entry here
# reports XFAIL and passes; if it starts passing it reports XPASS (remove the
# entry). Expired entries stop covering failures, so someone re-checks them.
#
# Fields:
#   scenario, subject: which test the entry applies to (required)
#   checks:  failure ids "<step name> :: <check path>", "llm :: <path>",
#            "<step name> :: error"; '*' is the only wildcard. Default ["*"].
#   reason:  what differs, observed in the transcript
#   issue:   upstream issue URL, once filed (M3)
#   expires: YYYY-MM-DD; review by then
#
# Triage notes: every entry below was confirmed from the raw transcript of a
# local run on 2026-10-15 (google-adk 2.12.0, adk-go v2.6.0, adk-rust 2.3.0),
# A2A entries on 2026-10-16 (a2a-sdk 1.2.2, a2a-go v2.6.0, adk-server 2.3.0
# with a2a-v1, a2a-server-lf 0.5.2). Subjects "a2a-<lang>" are bare A2A hosts;
# "<client>-to-<server>" are client pairs.
divergences:
  # --- adk-go -------------------------------------------------------------------
  - scenario: api_session_create_with_id_001
    subject: go
    checks: ["create session with id :: body.id"]
    reason: adk-go ignores the client-chosen sessionId in POST .../sessions and generates its own id.
    issue: https://github.com/google/adk-go/issues/1869
    expires: "2027-01-15"
  - scenario: evt_event_fields_001
    subject: go
    checks: ["one turn :: final.timestamp"]
    reason: adk-go REST events carry no timestamp field.
    issue: https://github.com/google/adk-go/issues/1868
    expires: "2027-01-15"

  # --- adk-rust (community) -------------------------------------------------------
  - scenario: api_health_version_001
    subject: rust
    checks: ["version :: status"]
    reason: adk-rust serves no GET /api/version (404).
    expires: "2027-01-15"
  - scenario: api_run_unknown_session_001
    subject: rust
    checks: ["run unknown session :: status", "llm :: request_count"]
    reason: adk-rust runs the agent (HTTP 200, one LLM call) for a session id that was never created instead of rejecting the request.
    expires: "2027-01-15"
  - scenario: api_session_create_with_id_001
    subject: rust
    checks: ["create session with id :: body.id"]
    reason: adk-rust ignores the client-chosen sessionId in POST .../sessions and generates its own id.
    expires: "2027-01-15"
  - scenario: evt_finish_reason_001
    subject: rust
    checks: ["truncated turn :: final.finishReason"]
    reason: adk-rust serializes finishReason as Rust enum variant names (MaxTokens, Stop) instead of the Gemini API values (MAX_TOKENS, STOP).
    expires: "2027-01-15"
  - scenario: evt_invocation_id_001
    subject: rust
    checks: ["first run :: event_count"]
    reason: adk-rust emits an extra empty partial event (no content) between the function call event and the function response event.
    expires: "2027-01-15"
  - scenario: evt_streaming_partials_001
    subject: rust
    checks: ["streaming turn :: final.content.parts[0].text", "streaming turn :: event_count"]
    reason: With streaming on, adk-rust marks the last chunk as the final event and keeps all chunks as separate text parts, instead of emitting one aggregated text event after the partials.
    expires: "2027-01-15"
  - scenario: llm_generate_method_001
    subject: rust
    checks: ["llm :: requests[0].method"]
    reason: adk-rust always calls streamGenerateContent, even when streaming is off.
    expires: "2027-01-15"
  - scenario: llm_history_001
    subject: rust
    checks: ["llm :: requests[1].body.contents*"]
    reason: adk-rust sends the agent instruction as a leading user turn (no systemInstruction), so it appears in the history contents.
    expires: "2027-01-15"
  - scenario: llm_system_instruction_001
    subject: rust
    checks: ["llm :: requests[0].body.systemInstruction*", "llm :: requests[0].body.contents"]
    reason: adk-rust sends the instruction as a user turn instead of systemInstruction and omits the agent identity text that Python and Go append.
    expires: "2027-01-15"
  - scenario: llm_tool_declarations_001
    subject: rust
    checks: ["llm :: requests[0].body.tools*"]
    reason: adk-rust declares tools in random order (adk_core::LlmRequest.tools is a HashMap), so order-dependent checks fail; can occasionally XPASS by chance.
    expires: "2027-01-15"
  - scenario: tool_long_running_001
    subject: rust
    checks: ["start approval :: events[*].longRunningToolIds", "resume with approval :: final.content.parts[0].text"]
    reason: adk-rust lists the tool name (request_approval), not the function call id, in longRunningToolIds; resuming with a function response returns one empty event instead of running the agent.
    expires: "2027-01-15"
  - scenario: tool_parallel_calls_001
    subject: rust
    checks: ["parallel tool turn :: function_responses[*].id", "llm :: requests[1].body.contents[-1].parts*"]
    reason: adk-rust drops call ids from function response events, and sends parallel function responses to the model as separate contents instead of one content with two parts.
    expires: "2027-01-15"
  - scenario: tool_return_wrapping_001
    subject: rust
    checks: ["tool turn :: function_responses[0].response", "tool turn :: function_responses[0].id"]
    reason: 'adk-rust does not wrap non-object tool results as {"result": ...} (sends 5, not {"result": 5}) and drops the call id from the function response event.'
    expires: "2027-01-15"
  - scenario: tool_roundtrip_001
    subject: rust
    checks: ["tool turn :: event_count", "tool turn :: authors", "tool turn :: function_calls[0].id", "tool turn :: function_responses[0].id"]
    reason: adk-rust emits an extra empty partial event, and does not generate or pair function call ids when the model omits them.
    expires: "2027-01-15"

  # --- A2A: a2a-go (shared by adk-go and the bare a2a-go host) ---------------------
  - scenario: a2a_srv_cancel_001
    subject: go
    checks: ["cancel again :: error_code"]
    reason: CancelTask on an already canceled task returns the task instead of TaskNotCancelableError (-32002); the bare a2a-go host does the same. a2a-go makes re-cancel idempotent on purpose, against the spec text (spec question filed).
    issue: https://github.com/a2aproject/A2A/issues/2358
    expires: "2027-01-15"
  - scenario: a2a_srv_cancel_001
    subject: a2a-go
    checks: ["cancel again :: error_code"]
    reason: a2a-go v2.6.0 returns the canceled task instead of TaskNotCancelableError (-32002) when it is cancelled again (deliberately idempotent; the spec says error).
    issue: https://github.com/a2aproject/A2A/issues/2358
    expires: "2027-01-15"
  - scenario: a2a_srv_version_001
    subject: go
    checks: ["unsupported version :: error_code"]
    reason: An unsupported A2A-Version header (99.0) is served as v1 instead of VersionNotSupportedError (-32009); the bare a2a-go host does the same (a2a-go v2.6.0; ACTS VER-NEG-001 fails too).
    issue: https://github.com/a2aproject/a2a-go/issues/469
    expires: "2027-01-15"
  - scenario: a2a_srv_version_001
    subject: a2a-go
    checks: ["unsupported version :: error_code"]
    reason: a2a-go v2.6.0 accepts any A2A-Version header value instead of returning VersionNotSupportedError (-32009); ACTS VER-NEG-001 fails at this version.
    issue: https://github.com/a2aproject/a2a-go/issues/469
    expires: "2027-01-15"

  # --- A2A: adk-python client vs adk-go server -------------------------------------
  - scenario: a2a_cli_basic_001
    subject: python-to-go
    checks: ["turn :: final.author"]
    reason: adk-python's RemoteA2aAgent turns adk-go's streamed answer (an artifact update without lastChunk) into a partial event and ends with a final event that has no content; against every other server it ends with the answer.
    issue: https://github.com/google/adk-go/issues/2159
    expires: "2027-01-15"
  - scenario: a2a_cli_transfer_001
    subject: python-to-go
    checks: ["turn :: final.author"]
    reason: Same as a2a_cli_basic_001 (adk-python client, adk-go server) after a transfer to the remote agent.
    issue: https://github.com/google/adk-go/issues/2159
    expires: "2027-01-15"
  - scenario: a2a_interop_canonical_001
    subject: python-to-go
    checks: ["first turn :: final.author", "second turn :: final.author"]
    reason: Same as a2a_cli_basic_001 (adk-python client, adk-go server).
    issue: https://github.com/google/adk-go/issues/2159
    expires: "2027-01-15"

  # --- A2A: adk-rust server (adk-server 2.3.0 a2a::v1 components) -------------------
  - scenario: a2a_srv_wire_format_001
    subject: rust
    checks: ["send :: format.result_shape"]
    reason: 'SendMessage returns a bare Task as the JSON-RPC result instead of the v1 SendMessageResponse oneof ({"task": ...}); streaming events are wrapped correctly.'
    expires: "2027-01-15"
  - scenario: a2a_srv_input_required_001
    subject: rust
    checks: ["start :: *", "resume :: *"]
    reason: A long-running tool call does not move the task to TASK_STATE_INPUT_REQUIRED; the task completes with the model's follow-up text, and the function response sent with that taskId starts a new task.
    expires: "2027-01-15"
  - scenario: a2a_srv_cancel_001
    subject: rust
    checks: ["start :: state", "cancel :: error", "cancel :: state"]
    reason: configuration.returnImmediately is ignored (SendMessage waits for the run to finish), so CancelTask finds a completed task and returns TaskNotCancelableError.
    expires: "2027-01-15"
  - scenario: a2a_srv_jsonrpc_errors_001
    subject: rust
    checks: ["malformed json :: error_code", "invalid request :: error_code"]
    reason: Malformed JSON gets HTTP 400 and a request without `method` HTTP 422, both with a plain-text body from the HTTP framework, instead of JSON-RPC errors -32700 and -32600.
    expires: "2027-01-15"
  - scenario: a2a_srv_version_001
    subject: rust
    checks: ["unsupported version :: error_code"]
    reason: adk-server's version_negotiation middleware answers an unsupported A2A-Version on the JSON-RPC binding with HTTP 400 and a REST-style (AIP-193) error body instead of JSON-RPC error -32009.
    expires: "2027-01-15"

  # --- A2A: a2a-rs (official Rust SDK, the reference host for adk-rust) ------------
  - scenario: a2a_srv_cancel_001
    subject: a2a-rs
    checks: ["cancel again :: error_code"]
    reason: a2a-server-lf 0.5.2 returns the canceled task instead of TaskNotCancelableError (-32002) when it is cancelled again; idempotent on purpose (a2aproject/a2a-rs#195), against the spec text (spec question filed).
    issue: https://github.com/a2aproject/A2A/issues/2358
    expires: "2027-01-15"

  # --- A2A: adk-rust client (RemoteA2aV1Agent) --------------------------------------
  - scenario: a2a_cli_context_001
    subject: rust-to-rust
    checks: ["second turn :: a2a.context_ids[0]", "llm :: requests[1].body"]
    reason: adk-rust's RemoteA2aV1Agent sends no contextId on the second turn of a session, so the remote agent starts a new conversation.
    expires: "2027-01-15"
  - scenario: a2a_cli_context_001
    subject: rust-to-go
    checks: ["second turn :: a2a.context_ids[0]", "llm :: requests[1].body"]
    reason: Same as rust-to-rust (adk-rust client does not reuse the contextId).
    expires: "2027-01-15"
  - scenario: a2a_cli_basic_001
    subject: rust-to-python
    checks: ["turn :: final.author", "turn :: texts"]
    reason: adk-rust's v1 client splits SSE events on "\n\n" only; a2a-python (sse-starlette) separates events with CRLF, so the client yields no events from the stream. SSE allows both.
    expires: "2027-01-15"
  - scenario: a2a_cli_context_001
    subject: rust-to-python
    checks: ["first turn :: texts", "second turn :: texts", "second turn :: a2a.context_ids[0]", "llm :: requests[1].body"]
    reason: adk-rust's client misses CRLF-delimited SSE events from a2a-python (see a2a_cli_basic_001) and does not reuse the contextId.
    expires: "2027-01-15"
  - scenario: a2a_cli_transfer_001
    subject: rust-to-python
    checks: ["turn :: final.author", "turn :: texts"]
    reason: adk-rust's client misses CRLF-delimited SSE events from a2a-python (see a2a_cli_basic_001).
    expires: "2027-01-15"
  - scenario: a2a_cli_remote_failure_001
    subject: rust-to-python
    checks: ["turn :: events"]
    reason: adk-rust's client misses CRLF-delimited SSE events from a2a-python (see a2a_cli_basic_001), including the FAILED status.
    expires: "2027-01-15"
  - scenario: a2a_interop_canonical_001
    subject: rust-to-python
    checks: ["first turn :: texts", "first turn :: final.author", "second turn :: texts"]
    reason: adk-rust's client misses CRLF-delimited SSE events from a2a-python (see a2a_cli_basic_001).
    expires: "2027-01-15"
  - scenario: a2a_interop_canonical_001
    subject: rust-to-a2a-python
    checks: ["first turn :: texts", "first turn :: final.author", "second turn :: texts"]
    reason: adk-rust's client misses CRLF-delimited SSE events from the bare a2a-python server too, so the cause is the client, not the adk-python adapter.
    expires: "2027-01-15"

  # --- A2A: adk-go client vs adk-rust server ---------------------------------------
  - scenario: a2a_cli_basic_001
    subject: go-to-rust
    checks: ["turn :: final.author", "turn :: texts"]
    reason: 'adk-go''s client rejects adk-rust''s SendMessage result, a bare Task instead of the v1 oneof ("could not determine type"); see a2a_srv_wire_format_001 on rust.'
    expires: "2027-01-15"
  - scenario: a2a_cli_context_001
    subject: go-to-rust
    checks: ["first turn :: texts", "second turn :: texts", "second turn :: a2a.context_ids[0]", "llm :: requests[1].body"]
    reason: adk-go's client rejects adk-rust's bare-Task SendMessage result (see a2a_cli_basic_001 go-to-rust).
    expires: "2027-01-15"
  - scenario: a2a_cli_transfer_001
    subject: go-to-rust
    checks: ["turn :: final.author", "turn :: texts"]
    reason: adk-go's client rejects adk-rust's bare-Task SendMessage result (see a2a_cli_basic_001 go-to-rust).
    expires: "2027-01-15"
  - scenario: a2a_interop_canonical_001
    subject: go-to-rust
    checks: ["first turn :: texts", "first turn :: final.author", "second turn :: texts"]
    reason: adk-go's client rejects adk-rust's bare-Task SendMessage result (see a2a_cli_basic_001 go-to-rust).
    expires: "2027-01-15"
