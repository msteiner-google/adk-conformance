id: a2a_srv_jsonrpc_errors_001
area: a2a-srv
description: >
  JSON-RPC envelope errors: malformed JSON returns -32700, an invalid request
  object returns -32600, an unknown method returns -32601. HTTP status and
  error body shape are compared across SDKs.
behaviors: [A2A-SRV-031]
a2a: {app: hello_agent}
steps:
  - name: malformed json
    a2a.raw: {raw_body: "{not json"}
    expect:
      error_code: -32700
  - name: invalid request
    a2a.raw: {body: {jsonrpc: "2.0", id: 1, params: {}}}
    expect:
      error_code: -32600
  - name: unknown method
    a2a.raw: {body: {jsonrpc: "2.0", id: 2, method: "NoSuchMethod", params: {}}}
    expect:
      error_code: -32601
