id: a2a_srv_interfaces_001
area: a2a-srv
description: >
  Every interface the card declares is actually served: a GetTask for an
  unknown id on each declared JSON-RPC / HTTP+JSON interface gets an A2A
  answer (TaskNotFoundError), not a transport failure.
behaviors: [A2A-SRV-006]
a2a: {app: hello_agent}
steps:
  - name: probe
    a2a.check_interfaces: {}
    expect:
      all_reachable: true
