id: a2a_srv_stream_chunks_001
area: a2a-srv
description: >
  A model reply streamed in chunks reaches the A2A client as the full text.
  How chunks map to TaskArtifactUpdateEvents (one artifact or several,
  append/lastChunk flags) and which Gemini method the SDK calls are compared
  across SDKs.
behaviors: [A2A-SRV-012]
a2a: {app: hello_agent}
model_script:
  - reply: {text: "Hello streaming world", chunks: ["Hello ", "streaming ", "world"]}
steps:
  - name: stream
    a2a.stream: {text: "Stream please"}
    expect:
      closed: true
      final_state: TASK_STATE_COMPLETED
      events: {contains: "world"}
