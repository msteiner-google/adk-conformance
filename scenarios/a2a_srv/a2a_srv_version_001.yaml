id: a2a_srv_version_001
area: a2a-srv
description: >
  A2A-Version negotiation: "1.0" is served as v1; an unsupported version
  returns VersionNotSupportedError (-32009). What a request without the header
  (meaning 0.3) gets is compared across SDKs.
behaviors: [A2A-SRV-007]
a2a: {app: hello_agent}
model_script:
  - reply: {text: "Hello from the scripted model!"}
steps:
  - name: version 1.0
    a2a.send_message: {text: "Say hello", version: "1.0"}
    expect:
      error: null
      state: TASK_STATE_COMPLETED
  - name: unsupported version
    a2a.send_message: {text: "Say hello", version: "99.0"}
    expect:
      error_code: -32009
  - name: no version header
    a2a.send_message: {text: "Say hello", version: null}
