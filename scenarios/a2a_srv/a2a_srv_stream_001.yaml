id: a2a_srv_stream_001
area: a2a-srv
description: >
  SendStreamingMessage emits the Task (or a Message) first, then status and
  artifact updates, reaches a terminal state and closes the stream. The final
  text arrives in the stream.
behaviors: [A2A-SRV-010, A2A-SRV-011]
a2a: {app: hello_agent}
model_script:
  - reply: {text: "Hello from the scripted model!"}
steps:
  - name: stream
    a2a.stream: {text: "Say hello"}
    expect:
      status: 200
      content_type: {contains: text/event-stream}
      closed: true
      errors: []
      first_kind: {in: [task, message]}
      final_state: TASK_STATE_COMPLETED
      events: {contains: "Hello from the scripted model!"}
expect_llm:
  request_count: 1
