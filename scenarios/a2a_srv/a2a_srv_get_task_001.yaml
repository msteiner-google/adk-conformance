id: a2a_srv_get_task_001
area: a2a-srv
description: >
  GetTask returns the stored task (same id, state and context) including its
  history, and honors historyLength.
behaviors: [A2A-SRV-025]
a2a: {app: hello_agent}
model_script:
  - reply: {text: "Hello from the scripted model!"}
steps:
  - name: send
    a2a.send_message: {text: "Say hello"}
    save_as: sent
    expect:
      state: TASK_STATE_COMPLETED
  - name: get
    a2a.get_task: {id: "{{sent.task_id}}"}
    expect:
      error: null
      task.id: "{{sent.task_id}}"
      task.contextId: "{{sent.context_id}}"
      state: TASK_STATE_COMPLETED
      history_texts: {contains: "Say hello"}
  - name: get with historyLength 1
    a2a.get_task: {id: "{{sent.task_id}}", history_length: 1}
    expect:
      error: null
      task.history: {len: 1}
